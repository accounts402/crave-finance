<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave Holding – Finance</title>
<meta name="theme-color" content="#121214">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Crave Finance">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#D97706;--gold2:#F59E0B;--ink:#121214;--mut:#6B7280;--line:#E5E7EB;--card:#FFFFFF;--bg:#F8F9FA;--ok:#1F7A4A;--ok-l:#E3F4EA;--red:#B3261E;--red-l:#FBE7E5;--warn:#9A6200;--warn-l:#FFF2DA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;background:radial-gradient(130% 60% at 50% 0%,#FFFFFF 0%,#F8F9FA 100%) fixed}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.nav{display:flex;align-items:center;gap:10px;background:#121214;padding:10px 16px;border-bottom:1px solid rgba(245,158,11,.35);position:sticky;top:0;z-index:20}
.nav img{height:30px;filter:brightness(0) invert(1)}
.nav .who{color:#F3F4F6;font-size:13px;text-align:right;line-height:1.2}
.nav .who small{display:block;color:#9CA3AF;font-size:11px}
.nav button{border:0;background:none;color:#F3F4F6;font-size:13px;text-decoration:underline}
.demo{background:#FCD34D;color:#121214;font-size:12.5px;text-align:center;padding:6px 10px;font-weight:600}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 14px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:#4B5563;border-radius:11px;padding:9px 13px;font-weight:600;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,#F59E0B,var(--gold));color:#121214;border-color:transparent;box-shadow:0 4px 12px rgba(217,119,6,.3)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.06)}
.panel h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi .l{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:700;color:var(--mut);margin-right:4px}
.ctl{display:flex;flex-direction:column;gap:10px}
.ctl .fld label{margin-top:0}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.acts .btn,.acts label.btn{width:100%;margin:0;text-align:center;display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E5E7EB;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:13.5px;color:#4B5563;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,24,39,.2)}
.ctl .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.pt td,.pt th{white-space:nowrap}.pt td.sub{padding-left:22px;color:#4B5563;font-size:13px}.pt tr.grp td{background:#F9FAFB;font-weight:700}.pt th.hl,.pt td.hl{background:#FEF3C7;font-weight:700}
.okbox{background:var(--ok-l);color:var(--ok);border-radius:11px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 18px;padding:12vh 4px 22px;max-width:640px;margin:0 auto}
.app{background:none;border:0;width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.app .ai{width:72px;height:72px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(17,24,39,.12);display:flex;align-items:center;justify-content:center}
.app .ai svg{width:44px;height:44px}.app:active .ai{transform:scale(.95)}
.app .an{font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.mods{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mod{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(17,24,39,.06);color:var(--ink)}
.mod .mi{font-size:30px;width:52px;height:52px;border-radius:14px;background:#FEF3C7;display:flex;align-items:center;justify-content:center}
.mod .mn{font-weight:800;font-size:16px}.mod .md{font-size:13px;color:var(--mut);margin-top:3px}.mod .ma{font-size:26px;color:var(--gold)}
.crumb{font-size:14px;margin:4px 0 2px}
.burger{border:0;background:none;width:34px;height:34px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3.5px;padding:0;text-decoration:none!important}
.burger span{display:block;width:17px;height:1.6px;border-radius:2px;background:#F3F4F6}
.chatbtn{position:relative;border:0;background:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0;margin-left:10px}
.cbadge{position:absolute;top:1px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#E8604C;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chat{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;background:#F8F9FA;z-index:60;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.chat .ch{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#121214;color:#FCD34D}
.chat .ch b{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}
.chat .cl{flex:1;overflow:auto;padding:12px 12px 4px}
.msg{display:flex;gap:9px;margin-bottom:12px}.msg .av{flex:none;width:32px;height:32px;border-radius:50%;background:#F59E0B;color:#121214;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.msg .bub{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 11px;max-width:85%;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:#FFFBEB;border-radius:14px 4px 14px 14px}
.msg.tagme .bub{border-color:#E8604C;box-shadow:0 0 0 1px #E8604C inset}
.msg .mt{font-size:11.5px;color:var(--mut);margin-bottom:2px}.msg.me .mt{text-align:right}
.mention{color:#8E3B6E;font-weight:700}
.msg .del{border:0;background:none;color:var(--mut);font-size:11px;padding:0 4px;text-decoration:underline}
.chat .ci{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;background:#FFFFFF;position:relative}
.chat textarea{flex:1;resize:none;border:1.5px solid #D1D5DB;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:15px;max-height:120px;outline:none}
.sugg{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:220px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font-size:14px}.sugg button:hover,.sugg button.on{background:#FEF3C7}
.sugg small{color:var(--mut);margin-left:6px}
.menu{position:absolute;top:calc(100% + 6px);right:12px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:230px;overflow:hidden}
.menu .mwho{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start}
.menu .mwho small{color:var(--mut);font-size:12px;margin-top:2px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;font-size:14.5px;color:var(--ink)!important;text-decoration:none!important}
.menu button:hover{background:#FEF3C7}
.dnav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.dnav .btn{padding:11px 0}
input[type=month].inp,input[type=date].inp{-webkit-appearance:none;appearance:none;min-height:46px;display:block;text-align:left}
@media(max-width:600px){.ctl .top{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi{padding:11px 12px}.kpi .v{font-size:17px}.kpi .l{font-size:9.5px}h1{font-size:26px}}
.kpi .h{font-size:12px;color:var(--mut);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 5px;color:#374151}
.inp{width:100%;min-width:0;border:1.5px solid #D1D5DB;border-radius:11px;padding:11px 12px;background:#fff;outline:none}
.inp:focus{border-color:#F59E0B}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#121214;white-space:nowrap}
.btn.ghost{background:var(--card);border:1.5px solid #F59E0B;color:var(--ink)}
.btn.dark{background:#121214;color:#FCD34D}
.btn.green{background:linear-gradient(135deg,#2E8B57,#1F6B42);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.err{color:var(--red);font-size:13px;min-height:16px;margin-top:6px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.up{background:var(--ok-l);color:var(--ok)}.pill.down{background:var(--red-l);color:var(--red)}.pill.g{background:#E5E7EB;color:#4B5563}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#121214;color:#FCD34D;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
/* login */
.lgbg{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#27272A 0%,#09090B 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.lgcard{background:#FFFFFF;border:1px solid rgba(245,158,11,.5);border-radius:22px;padding:30px 22px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.lgcard img{width:220px;display:block;margin:0 auto 4px}
.lgcard .t{text-align:center;color:#6B7280;margin-bottom:16px;letter-spacing:.5px}
.lgcard .btn{width:100%;margin-top:14px;padding:13px}
.link{background:none;border:0;color:#B45309;text-decoration:underline;font-size:13px;padding:0;margin-top:12px}
/* tables */
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
table.t td{padding:9px 6px;border-bottom:1px solid #F3F4F6}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.lstitle{text-align:center;font-weight:800;font-size:12px;letter-spacing:.5px;padding:7px;background:#FEF3C7;border:1px solid #D1D5DB;border-bottom:0;border-radius:10px 10px 0 0}
.lswrap{border:1px solid #D1D5DB;max-height:72vh;overflow:auto;border-radius:0 0 10px 10px}
table.ls{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
table.ls th{background:#FEF3C7;font-size:9.5px;font-weight:800;padding:6px;border:1px solid #D1D5DB;position:sticky;top:0;z-index:1;max-width:90px;line-height:1.2}
table.ls td{padding:5px 7px;border:1px solid #E5E7EB;text-align:right;white-space:nowrap;min-width:76px;background:#fff}
table.ls .stk{position:sticky;left:0;background:#F9FAFB;text-align:center;font-weight:700;z-index:2}
table.ls th.stk{z-index:3;background:#FEF3C7}
table.ls .tt{background:#FDE68A!important;font-weight:700}
table.ls tr.ed{cursor:pointer}table.ls tr.ed:hover td{background:#FFFBEB}
table.ls tr.ft td{background:#E5E7EB;font-weight:800;border-top:2px solid #9CA3AF}
table.ls tr.ft2 td{background:#F9FAFB;text-align:center;font-weight:700}
table.ls tr.ft3 td{background:#FEF3C7;font-weight:700}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,15,10,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#F8F9FA;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 18px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.shh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px}
.shh h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;margin:0}
.x{border:0;background:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
.sbody{padding:0 16px}
.erow{display:flex;gap:10px;align-items:center;margin-top:8px}.erow span{flex:1.3;font-size:14px}.erow .inp{flex:1;text-align:right}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum.tot{font-size:17px;font-weight:800;border-top:1px dashed #D1D5DB;margin-top:8px;padding-top:10px}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:26px 8px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid #E5E7EB;border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.warnbox{background:var(--warn-l);color:#6b4500;border-radius:11px;padding:10px 12px;font-size:13px;margin-top:10px}
/* ===== light single-colour theme ===== */
.nav>img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
:root{--acc:#D97706;--acc-d:#B45309;--acc-l:#FFF7E8;--acc-b:#FAD9A8}
body{background:#F8F9FA!important}
.demo{background:var(--acc-l)!important;color:var(--acc-d)!important;border-bottom:1px solid var(--acc-b)}
.nav{background:#fff!important;border-bottom:1px solid #E5E7EB!important}
.nav img{filter:brightness(.55) saturate(1.4)!important}
.lgcard img{filter:brightness(.55) saturate(1.4)}
.burger span{background:#374151!important}
.chatbtn svg{stroke:#374151!important}
.btn,.btn.ghost,.btn.green,.btn.dark{background:var(--acc-l)!important;color:var(--acc-d)!important;border:1px solid var(--acc-b)!important;box-shadow:none!important}
.btn:hover{background:#FDEBCB!important}
.tabs button{background:#fff!important;color:#4B5563!important;border:1px solid #E5E7EB!important;box-shadow:none!important}
.tabs button.on{background:var(--acc-l)!important;color:var(--acc-d)!important;border-color:var(--acc-b)!important}
.seg{background:#F3F4F6!important;border-color:#E5E7EB!important}.seg button{color:#6B7280!important}.seg button.on{background:#fff!important;color:var(--acc-d)!important;box-shadow:0 1px 3px rgba(0,0,0,.08)!important}
.kpi .v[style]{color:var(--acc-d)!important}
.lstitle{background:#fff!important;border-color:#E5E7EB!important;color:#111827}
.lswrap{border-color:#E5E7EB!important}
table.ls th{background:#F9FAFB!important;border-color:#E5E7EB!important;color:#374151}
table.ls td{border-color:#F1F2F4!important}
table.ls .stk{background:#FCFCFD!important}
table.ls .tt{background:var(--acc-l)!important}
table.ls tr.ft td{background:#F3F4F6!important;border-top-color:#D1D5DB!important}
table.ls tr.ft2 td,table.ls tr.ft3 td{background:#F9FAFB!important}
table.ls tr.ed:hover td{background:var(--acc-l)!important}
.okbox{background:var(--acc-l)!important;color:var(--acc-d)!important}
.lgbg{background:#F8F9FA!important}
.lgcard{background:#fff!important;border-color:#E5E7EB!important;box-shadow:0 10px 30px rgba(17,24,39,.08)!important}
.link,.crumb .link{color:var(--acc-d)!important}
.msg .av{background:var(--acc-l)!important;color:var(--acc-d)!important;border:1px solid var(--acc-b)}
.chat .ch{background:#fff!important;color:#111827!important;border-bottom:1px solid #E5E7EB}
.cbadge{background:var(--acc)!important}
.inp:focus{border-color:var(--acc)!important}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="layer"></div>
<script>
/* =================== helpers =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=v=>v?Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'-';
const qarK=v=>'<small>QAR</small>'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const qar=v=>'QAR '+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fdate=s=>new Date(s+'T12:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const monthName=m=>new Date(m+'-01T12:00').toLocaleString('en-GB',{month:'long',year:'numeric'});
const daysIn=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const addMonth=(m,n)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return iso(d).slice(0,7)};
const r2=v=>Math.round(v*100)/100;
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function modal(h){$('#layer').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
function pct(a,b){if(!b)return a?'<span class="pill up">new</span>':'<span class="pill g">—</span>';const p=(a-b)/b*100;return `<span class="pill ${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span>`}
function loadScript(src,test){return test()?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Could not load '+src));document.head.appendChild(s)})}
const XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const JSPDF_SRC='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const AUTOTABLE_SRC='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9+]/g,'');

/* =================== data layer =================== */
const CFG=window.CRAVE_CONFIG||{};
const DEMO=!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY;
let DB;

if(!DEMO){
  const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const chk=({data,error})=>{if(error)throw new Error(error.message);return data};
  DB={
    async user(){const {data}=await sb.auth.getSession();return data.session?data.session.user:null},
    async signIn(email,password){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error(error.message==='Invalid login credentials'?'Wrong email or password':error.message)},

    async updateProfile(id,patch){chk(await sb.from('profiles').update(patch).eq('id',id))},

function showLogin(msg){lgShell(`<form onsubmit="event.preventDefault();doLogin()"><label>Email</label><input class="inp" id="em" type="email" autocomplete="username" placeholder="${DEMO?'admin@demo':'you@craveholding.com'}">
  <label>Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="${DEMO?'anything':''}">
  <div class="err" id="lgErr">${esc(msg||'')}</div><button class="btn" id="lgBtn">Sign in</button></form>
  ${DEMO?'<div class="hint" style="text-align:center">Demo logins: admin@demo · editor@demo · viewer@demo · new@demo</div>':`<div style="display:flex;justify-content:space-between"><button class="link" onclick="showForgot()">Forgot password?</button><button class="link" onclick="showSignup()">Request access</button></div>`}`);setTimeout(()=>$('#em')?.focus(),50)}
async function doLogin(){const b=$('#lgBtn');b.disabled=true;$('#lgErr').textContent='';try{await DB.signIn($('#em').value.trim(),$('#pw').value);await boot()}catch(e){$('#lgErr').textContent=e.message;b.disabled=false}}
function showForgot(){lgShell(`<p class="hint" style="text-align:center">Enter your email and we'll send a link to set a new password.</p><label>Email</label><input class="inp" id="em" type="email"><div class="err" id="lgErr"></div><button class="btn" onclick="doForgot()">Send link</button><button class="link" onclick="showLogin()">← Back to sign in</button>`)}
async function doForgot(){try{await DB.resetPassword($('#em').value.trim());$('#lgErr').style.color='var(--ok)';$('#lgErr').textContent='Check your email for the link.'}catch(e){$('#lgErr').textContent=e.message}}
function showSignup(){lgShell(`<p class="hint" style="text-align:center">Create your login. An admin must approve it before you can see any figures.</p><label>Full name</label><input class="inp" id="fn"><label>Work email</label><input class="inp" id="em" type="email"><label>Password (min 8)</label><input class="inp" id="pw" type="password"><div class="err" id="lgErr"></div><button class="btn" onclick="doSignup()">Request access</button><button class="link" onclick="showLogin()">← Back to sign in</button>`)}
async function doSignup(){const pw=$('#pw').value;if(pw.length<8){$('#lgErr').textContent='Use at least 8 characters';return}try{await DB.signUp($('#em').value.trim(),pw,$('#fn').value.trim());lgShell(`<p style="text-align:center">✅ Request sent.</p><p class="hint" style="text-align:center">Confirm your email from the message we sent, then ask your admin to approve your access.</p><button class="link" onclick="showLogin()">← Back to sign in</button>`)}catch(e){$('#lgErr').textContent=e.message}}
function showReset(){lgShell(`<p class="hint" style="text-align:center">Choose a new password.</p><label>New password (min 8)</label><input class="inp" id="pw" type="password"><div class="err" id="lgErr"></div><button class="btn" onclick="doReset()">Save password</button>`)}
async function doReset(){const pw=$('#pw').value;if(pw.length<8){$('#lgErr').textContent='Use at least 8 characters';return}try{await DB.updatePassword(pw);toast('Password saved');history.replaceState(null,'',location.pathname);boot()}catch(e){$('#lgErr').textContent=e.message}}
function showPending(){lgShell(`<p style="text-align:center"><b>Hi ${esc(A.me.full_name||A.me.email)}</b></p><p class="hint" style="text-align:center">Your account is waiting for approval. Ask the finance admin to give you access, then sign in again.</p><button class="btn ghost" onclick="logout()">Sign out</button>`)}
async function logout(){closeChat();clearInterval(C.bg);C.bg=null;C.members=[];C.msgs=[];await DB.signOut();A.me=null;A.mod=null;showLogin()}

function toggleMenu(e){e.stopPropagation();$('#menu').classList.toggle('hidden')}
function closeMenu(){const m=$('#menu');if(m)m.classList.add('hidden')}
document.addEventListener('click',e=>{const m=$('#menu');if(m&&!m.classList.contains('hidden')&&!m.contains(e.target))closeMenu()});
function home(){A.mod=null;render()}
/* =================== team chat =================== */
const C={open:false,members:[],msgs:[],timer:null,bg:null};
const lrKey=()=>'crave_chat_read_'+(A.me&&A.me.id);
const lastRead=()=>{try{return Number(localStorage.getItem(lrKey())||0)}catch(e){return 0}};
const setRead=id=>{try{localStorage.setItem(lrKey(),String(id))}catch(e){}};
const mName=id=>{const m=C.members.find(x=>x.id===id);return m?m.full_name:'Former member'};
function msgHtml(m){const mine=m.user_id===A.me.id,tag=(m.mentions||[]).includes(A.me.id);let b=esc(m.body);
  C.members.slice().sort((a,b)=>b.full_name.length-a.full_name.length).forEach(x=>{b=b.split('@'+esc(x.full_name)).join(`<span class="mention">@${esc(x.full_name)}</span>`)});
  const t=new Date(m.at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  return `<div class="msg ${mine?'me':''} ${tag&&!mine?'tagme':''}"><div class="av">${esc(mName(m.user_id).charAt(0).toUpperCase())}</div><div><div class="mt">${mine?'You':esc(mName(m.user_id))} · ${t}${mine||isAdmin()?` <button class="del" onclick="delMsg(${m.id})">delete</button>`:''}</div><div class="bub">${b}</div></div></div>`}
async function loadChat(){try{if(!C.members.length)C.members=await DB.members()||[];C.msgs=await DB.messages()||[]}catch(e){}}
function badge(){const el=$('#chatBadge');if(!el||!A.me)return;const lr=lastRead(),un=C.msgs.filter(m=>m.id>lr&&m.user_id!==A.me.id),tag=un.some(m=>(m.mentions||[]).includes(A.me.id));
  if(C.open||!un.length){el.classList.add('hidden');return}el.classList.remove('hidden');el.textContent=tag?'@':(un.length>9?'9+':un.length)}
function paintChat(stick){const l=$('#chatList');if(!l)return;const atEnd=l.scrollHeight-l.scrollTop-l.clientHeight<60;
  l.innerHTML=C.msgs.length?C.msgs.map(msgHtml).join(''):'<div class="empty">No messages yet. Say hello 👋<br><small>Type @ to mention someone.</small></div>';
  if(stick||atEnd)l.scrollTop=l.scrollHeight;if(C.msgs.length)setRead(C.msgs[C.msgs.length-1].id)}
async function openChat(){closeMenu();C.open=true;let el=$('#chatPanel');if(!el){el=document.createElement('div');el.id='chatPanel';document.body.appendChild(el)}
  el.innerHTML=`<div class="ov" style="align-items:stretch;justify-content:flex-end;background:rgba(20,15,10,.35)" onclick="if(event.target===this)closeChat()"><div class="chat"><div class="ch"><b>Team chat</b><button class="x" onclick="closeChat()">✕</button></div>
   <div class="cl" id="chatList"><div class="spin"></div></div>
   <div class="ci"><div id="sugg" class="sugg hidden"></div><textarea id="chatIn" rows="1" placeholder="Message… type @ to mention" oninput="chatInput()" onkeydown="chatKey(event)"></textarea><button class="btn" style="padding:11px 14px" onclick="sendChat()">Send</button></div></div></div>`;
  await loadChat();paintChat(true);badge();clearInterval(C.timer);C.timer=setInterval(async()=>{await loadChat();paintChat(false)},8000);setTimeout(()=>$('#chatIn')?.focus(),100)}
function closeChat(){C.open=false;clearInterval(C.timer);const el=$('#chatPanel');if(el)el.innerHTML='';badge()}
let S={list:[],i:0,start:-1};
function chatInput(){const t=$('#chatIn');t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px';
  const pos=t.selectionStart,before=t.value.slice(0,pos),m=before.match(/(^|\s)@([^@\n]{0,25})$/);const sg=$('#sugg');
  if(!m){sg.classList.add('hidden');S.start=-1;return}
  const q=m[2].toLowerCase();S.start=pos-m[2].length-1;S.list=C.members.filter(x=>x.id!==A.me.id&&(x.full_name.toLowerCase().includes(q)||(x.email||'').toLowerCase().startsWith(q))).slice(0,8);S.i=0;
  if(!S.list.length){sg.classList.add('hidden');return}
  sg.innerHTML=S.list.map((x,i)=>`<button class="${i===S.i?'on':''}" onmousedown="event.preventDefault();pickMention(${i})">@${esc(x.full_name)}<small>${esc(x.email||'')}</small></button>`).join('');sg.classList.remove('hidden')}
function pickMention(i){const t=$('#chatIn'),x=S.list[i];if(!x)return;const pos=t.selectionStart;t.value=t.value.slice(0,S.start)+'@'+x.full_name+' '+t.value.slice(pos);
  const np=S.start+x.full_name.length+2;t.setSelectionRange(np,np);$('#sugg').classList.add('hidden');S.start=-1;t.focus()}
function chatKey(e){const sg=$('#sugg');if(sg&&!sg.classList.contains('hidden')){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.i=(S.i+(e.key==='ArrowDown'?1:S.list.length-1))%S.list.length;[...sg.children].forEach((b,i)=>b.classList.toggle('on',i===S.i));return}
  if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickMention(S.i);return}if(e.key==='Escape'){sg.classList.add('hidden');return}}
  if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();sendChat()}}
async function sendChat(){const t=$('#chatIn'),body=t.value.trim();if(!body)return;const mentions=C.members.filter(x=>body.includes('@'+x.full_name)).map(x=>x.id);
  t.disabled=true;try{await DB.sendMessage(body,mentions);t.value='';t.style.height='auto';await loadChat();paintChat(true)}catch(e){toast(e.message)}t.disabled=false;t.focus()}
async function delMsg(id){try{await DB.deleteMessage(id);await loadChat();paintChat(false)}catch(e){toast(e.message)}}
function startChatBg(){clearInterval(C.bg);const tick=async()=>{if(!A.me||A.me.role==='pending'||C.open)return;await loadChat();badge()};tick();C.bg=setInterval(tick,60000)}
function openMod(m){A.mod=m;const t=modTabs(m);A.tab=t.length?t[0][0]:null;render()}
function render(){
  setTimeout(badge,0);
  const mods=MODULES.filter(m=>m.adminOnly?isAdmin():m.live?modTabs(m.k).length:canMod(m.k));
  if(!mods.length){lgShell(`<p style="text-align:center"><b>Hi ${esc(A.me.full_name||A.me.email)}</b></p><p class="hint" style="text-align:center">You don't have access to any section yet. Ask the finance admin.</p><button class="btn ghost" onclick="logout()">Sign out</button>`);return}
  if(A.mod&&!mods.some(m=>m.k===A.mod))A.mod=null;
  if(!A.mod&&mods.length===1&&mods[0].live)A.mod=mods[0].k;
  if(!A.mod){$('#app').innerHTML=navHtml()+`<div class="wrap">
    <div class="apps">${mods.map(m=>`<button class="app" onclick="openMod('${m.k}')"><div class="ai">${MICON[m.k]}</div><div class="an">${m.short||m.name}</div></button>`).join('')}</div></div>`;return}
  const M=MODULES.find(m=>m.k===A.mod),tabs=modTabs(A.mod);
  if(tabs.length&&!tabs.some(([k])=>k===A.tab))A.tab=tabs[0][0];
  $('#app').innerHTML=navHtml()+`<div class="wrap"><div class="crumb">${mods.length>1?`<button class="link" style="margin:0" onclick="home()">‹ All modules</button> · `:''}<b>${M.short}</b></div>
   ${tabs.length?`<div class="tabs">${tabs.map(([k,l])=>`<button class="${A.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div><div id="view"><div class="spin"></div></div>`:planHtml(M)}</div>`;
  if(tabs.length)view();
}
function planHtml(M){return `<div class="panel" style="margin-top:12px;text-align:center;padding:28px 18px"><div class="ai" style="width:72px;height:72px;margin:0 auto;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><div style="width:44px;height:44px">${MICON[M.k]}</div></div><h1 style="margin:10px 0 4px">${M.short}</h1><span class="pill" style="background:#FFF2DA;color:#9A6200">Coming soon</span></div>
  <div class="panel"><h3>Planned</h3>${M.plan.map(p=>`<div class="sum" style="justify-content:flex-start;gap:10px"><span>⏳</span><span>${p}</span></div>`).join('')}</div>`}
function go(t){A.tab=t;render()}
async function view(){
  const v=$('#view');
  try{v.innerHTML=await ({sheet:vSheet,day:vDay,month:vMonth,pay:vPay,team:vTeam,locs:vLocs,log:vLog})[A.tab]()}catch(e){v.innerHTML=`<div class="panel"><b>Could not load.</b><div class="err">${esc(e.message)}</div><button class="btn ghost" onclick="refresh()">Try again</button></div>`}
}

/* =================== daily sheet =================== */
async function sheetData(m){
  const L=activeLocs(),days=daysIn(m),rows=index(await salesFor(m+'-01',m+'-'+String(days).padStart(2,'0')));
  const grid=[];for(let d=1;d<=days;d++){const ds=m+'-'+String(d).padStart(2,'0'),r=rows[ds]||{};grid.push({ds,vals:L.map(l=>r[l.id]||0),has:L.some(l=>r[l.id])})}
  const tot=L.map((_,i)=>grid.reduce((a,g)=>a+g.vals[i],0)),T=tot.reduce((a,b)=>a+b,0),filled=grid.filter(g=>g.has).length;

async function importFile(input){
  const f=input.files[0];input.value='';if(!f)return;
  try{await loadScript(XLSX_SRC,()=>window.XLSX)}catch(e){return toast('Could not load the Excel reader – check internet')}
  let wb;try{wb=XLSX.read(await f.arrayBuffer(),{type:'array'})}catch(e){return toast('Could not read that file')}
  const L=activeLocs(),byName={};L.forEach(l=>byName[norm(l.name)]=l);const rows=[],unmatched=new Set(),days=new Set();
  wb.SheetNames.forEach(sn=>{const Aa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});let dc=-1;const hi=Aa.findIndex(r=>{dc=r.findIndex(c=>norm(c)==='DATE');return dc>=0});if(hi<0)return;
    const H=Aa[hi];let stop=false;const map=H.map((h,i)=>{if(i<=dc||stop)return null;const k=norm(h);if(k==='TOTAL'||k==='DATE'){stop=true;return null}if(!k)return null;if(byName[k])return byName[k];unmatched.add(String(h).trim());return null});
    for(let r=hi+1;r<Aa.length;r++){const d=Aa[r][dc];let ds=null;
      if(typeof d==='number'&&d>40000){const o=XLSX.SSF.parse_date_code(d);ds=`${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`}
      else{const s=String(d);let mm=s.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);if(mm)ds=`${mm[1]}-${mm[2].padStart(2,'0')}-${mm[3].padStart(2,'0')}`;else if((mm=s.match(/(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/)))ds=`${mm[3]}-${mm[2].padStart(2,'0')}-${mm[1].padStart(2,'0')}`}
      if(!ds)continue;
      map.forEach((l,i)=>{if(!l)return;const raw=Aa[r][i];const v=typeof raw==='number'?raw:parseFloat(String(raw).replace(/,/g,''));if(v>0){rows.push({sale_date:ds,location_id:l.id,amount:r2(v)});days.add(ds)}})}});
  if(!rows.length)return modal(`<div class="shh"><h2>Nothing to import</h2><button class="x" onclick="closeModal()">✕</button></div><div class="sbody"><p>No daily figures were found for <b>${KW().many}</b>. The sheet needs a header row with <b>DATE</b> and ${KW().low} names as columns, like your master sheet. Check the Branch/Brand switch matches your file.</p></div>`);
  const ds=[...days].sort(),existing=index(await DB.sales(ds[0],ds[ds.length-1]));let changes=0;rows.forEach(r=>{const e=(existing[r.sale_date]||{})[r.location_id];if(e!==undefined&&e!==r.amount)changes++});
  window._imp=rows;
  modal(`<div class="shh"><h2>Check before importing</h2><button class="x" onclick="closeModal()">✕</button></div><div class="sbody">
   <div class="sum"><span>File</span><b>${esc(f.name)}</b></div><div class="sum"><span>Days</span><b>${days.size} (${fdate(ds[0])} – ${fdate(ds[ds.length-1])})</b></div>
   <div class="sum"><span>Figures</span><b>${rows.length}</b></div><div class="sum"><span>Total</span><b>${qar(rows.reduce((a,r)=>a+r.amount,0))}</b></div>
   ${changes?`<div class="warnbox">⚠ ${changes} figure(s) already in the system will be <b>replaced</b> with the values from this file.</div>`:''}
   ${unmatched.size?`<div class="warnbox">These columns were not matched to a ${KW().low} and will be skipped: <b>${[...unmatched].map(esc).join(', ')}</b>${isAdmin()?'. Add them under Locations first if needed.':''}</div>`:''}
   <div class="err" id="iErr"></div><button class="btn" style="width:100%;margin-top:12px" id="iBtn" onclick="doImport()">Import ${rows.length} figures</button></div>`)}
async function doImport(){$('#iBtn').disabled=true;try{await DB.upsert(window._imp);const last=window._imp.map(r=>r.sale_date).sort().pop();A.cache={};A.month=last.slice(0,7);closeModal();toast('Imported ✓');view()}catch(e){$('#iErr').textContent=e.message;$('#iBtn').disabled=false}}

  return {rows,tot,T,daily,from,to}}

   <div class="kpis"><div class="kpi"><div class="l">Total · ${per}</div><div class="v" style="color:var(--ok)">${qarK(D.T)}</div></div>
    <div class="kpi"><div class="l">Counter sales</div><div class="v">${qarK(D.tot[PI('COUNTER SALES')])}</div><div class="h">${D.T?(D.tot[PI('COUNTER SALES')]/D.T*100).toFixed(1):0}%</div></div>
    <div class="kpi"><div class="l">Delivery apps</div><div class="v">${qarK(D.tot[PI('DELIVERY APP')])}</div><div class="h">${D.T?(D.tot[PI('DELIVERY APP')]/D.T*100).toFixed(1):0}%</div></div>
    <div class="kpi"><div class="l">Catering + other</div><div class="v">${qarK(D.tot[PI('CATERING')]+D.tot[PI('OTHER')])}</div></div></div>
   ${D.T||D.daily?(Math.abs(diff)<0.01?`<div class="okbox">✓ Matches the daily sales sheet (${qar(D.daily)})</div>`:`<div class="warnbox" style="margin:0 0 10px">⚠ Daily sales sheet shows ${qar(D.daily)} – difference ${qar(diff)}. Some payment details may be missing.</div>`):''}
   ${A.payView==='channel'?chanHtml(D):`<div class="lstitle">${esc(payTitle())}</div><div class="lswrap"><table class="ls pt"><tr><th class="stk">${KW().one.toUpperCase()}</th>${PM_COLS.map(c=>`<th class="${PM_HL.has(c)?'tt':''}">${c}</th>`).join('')}</tr>
    ${D.rows.map(r=>`<tr class="${r.grp?'grp':''}"><td class="stk" style="text-align:left;${r.lvl?'padding-left:20px;font-weight:500;color:#4B5563':''}">${r.lvl?'↳ ':''}${esc(r.name)}</td>${r.vals.map((v,i)=>`<td class="${PM_HL.has(PM_COLS[i])?'tt':''}">${n2(v)}</td>`).join('')}</tr>`).join('')}
    <tr class="ft"><td class="stk">TOTAL</td>${D.tot.map(v=>`<td>${n2(v)}</td>`).join('')}</tr>
    <tr class="ft2"><td class="stk">PERCENTAGE</td>${D.tot.map(v=>`<td>${D.T?(v/D.T*100).toFixed(1):0}%</td>`).join('')}</tr></table></div>`}`}
function chanData(D){const sel=A.payFilter&&D.rows.find(r=>r.id===A.payFilter&&!r.lvl);const v=sel?sel.vals:D.tot;const T=v[v.length-1];
  const groups=[['Counter sales',PM_COUNTER,PI('COUNTER SALES')],['Delivery apps',PM_APPS,PI('DELIVERY APP')],['Catering',['CATERING'],PI('CATERING')],['Other',['OTHER'],PI('OTHER')]];
  return {name:sel?sel.name:'All '+KW().many.toLowerCase(),T,groups:groups.map(([g,ks,gi])=>({g,amt:v[gi],items:ks.map(k=>({k,amt:v[PM_COLS.indexOf(k)]}))}))}}
function chanHtml(D){const C=chanData(D),pc=a=>C.T?(a/C.T*100).toFixed(1)+'%':'-',max=Math.max(1,...C.groups.flatMap(g=>g.items.map(i=>i.amt)));
  return `<div class="panel"><h3>Channel sales analysis · ${esc(C.name)}</h3><p class="hint" style="margin-top:-4px">${A.payDay?fdate(D.from):monthName(A.month)}</p>
   <div class="tscroll"><table class="t"><tr><th>Channel</th><th class="n">Amount (QAR)</th><th class="n">Share</th><th style="width:30%"></th></tr>
   ${C.groups.map(g=>`<tr class="tot"><td>${g.g}</td><td class="n">${n2(g.amt)}</td><td class="n">${pc(g.amt)}</td><td></td></tr>
     ${g.items.length>1?g.items.map(i=>`<tr><td style="padding-left:20px">${i.k.charAt(0)+i.k.slice(1).toLowerCase()}</td><td class="n">${n2(i.amt)}</td><td class="n">${pc(i.amt)}</td><td><div style="height:8px;border-radius:4px;background:var(--gold);width:${(i.amt/max*100).toFixed(1)}%"></div></td></tr>`).join(''):''}`).join('')}
   <tr class="tot"><td>TOTAL</td><td class="n">${n2(C.T)}</td><td class="n">100%</td><td></td></tr></table></div></div>`}
function exportChan(kind){const D=A._pay,C=chanData(D),pc=a=>C.T?(a/C.T*100).toFixed(1)+'%':'-',title='CHANNEL SALES ANALYSIS – '+C.name.toUpperCase()+' – '+(A.payDay?fdate(D.from):monthName(A.month)).toUpperCase(),head=['Channel','Amount (QAR)','Share'];
  const body=[];C.groups.forEach(g=>{body.push([g.g.toUpperCase(),r2(g.amt),pc(g.amt)]);if(g.items.length>1)g.items.forEach(i=>body.push(['   '+i.k,r2(i.amt),pc(i.amt)]))});body.push(['Total',r2(C.T),'100%']);
  const file='Crave_Channel_Sales_'+(A.payDay?D.from:A.month);
  if(kind==='xlsx')return xlsxOut(file,[['Channel sales',[[title],[],head,...body]]]);pdfOut(file,'portrait','a4',title,[[null,head,body]])}
function payTitle(){return `CRAVE SALES ${A.payDay?fdate(A._pay.from).toUpperCase():monthName(A.month).toUpperCase()} DETAILED SUMMARY – ${KW().many.toUpperCase()}`}
function exportPay(kind){if(A.payView==='channel')return exportChan(kind);const D=A._pay,title=payTitle(),head=[KW().one.toUpperCase(),...PM_COLS];
  const body=[...D.rows.map(r=>[(r.lvl?'   ':'')+r.name,...r.vals.map(r2)]),['TOTAL',...D.tot.map(r2)],['PERCENTAGE',...D.tot.map(v=>(D.T?(v/D.T*100).toFixed(1):0)+'%')]];
  const file='Crave_Payment_Modes_'+KW().one+'_'+(A.payDay?D.from:A.month);
  if(kind==='xlsx')return xlsxOut(file,[['Payment modes',[[title],head,...body],{merge:head.length}]]);
  pdfOut(file,'landscape','a3',title,[[null,head,body]])}

/* =================== exports =================== */
async function xlsxOut(file,sheets){
  try{await loadScript(XLSX_SRC,()=>window.XLSX)}catch(e){return toast('Could not load Excel tool – check internet')}
  const wb=XLSX.utils.book_new();
  sheets.forEach(([name,aoa,opt])=>{const ws=XLSX.utils.aoa_to_sheet(aoa);Object.keys(ws).forEach(a=>{if(a[0]!=='!'&&ws[a].t==='n')ws[a].z='#,##0.00'});
    ws['!cols']=(aoa.find(r=>r.length>2)||aoa[0]).map((_,i)=>({wch:i?14:22}));if(opt&&opt.merge)ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:opt.merge-1}}];XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});
  download(file+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
async function pdfOut(file,orient,fmt,title,tables){
  try{await loadScript(JSPDF_SRC,()=>window.jspdf);await loadScript(AUTOTABLE_SRC,()=>window.jspdf&&window.jspdf.jsPDF.API.autoTable)}catch(e){return toast('Could not load PDF tool – check internet')}
  const doc=new jspdf.jsPDF({orientation:orient,unit:'pt',format:fmt}),W=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(title,W/2,32,{align:'center'});
  const ft=['ACTUAL TOTAL','PERCENTAGE','AVERAGE','FORECASTED','Total'];
  tables.forEach(([,head,body])=>doc.autoTable({startY:44,head:[head],theme:'grid',
    body:body.map(r=>r.map((c,i)=>i&&typeof c==='number'?(c?c.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'-'):String(c))),
    headStyles:{fillColor:[243,235,217],textColor:30,fontSize:fmt==='a3'?6.5:9,halign:'center',valign:'middle'},styles:{fontSize:fmt==='a3'?6.5:9,cellPadding:fmt==='a3'?2:4,halign:'right',lineColor:[200,185,150],lineWidth:.3},
    columnStyles:{0:{halign:fmt==='a3'?'center':'left',fontStyle:'bold'}},margin:{left:20,right:20},
    didParseCell:d=>{if(d.section!=='body')return;const r=d.row.raw;if(ft.includes(r[0])){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=r[0]==='ACTUAL TOTAL'||r[0]==='Total'?[234,223,198]:[246,238,219]}}}));
  const H=doc.internal.pageSize.getHeight(),n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(120);doc.text('Crave Holding · generated '+new Date().toLocaleString('en-GB')+' by '+(A.me.full_name||A.me.email)+' · page '+p+'/'+n,20,H-12)}
  download(file+'.pdf',doc.output('blob'))}

/* =================== admin: team =================== */
async function vTeam(){
  const P=await DB.profiles(),L=A.locs;A._prof=P;
  return `<h1>Team & access</h1><p class="sub">Approve new people and choose what they can see. <b>Viewer</b> = reports only · <b>Editor</b> = can enter/import figures · <b>Admin</b> = everything.</p>
   <div class="panel"><b>Adding someone:</b> send them this app link – they tap <b>Request access</b>, confirm their email, then appear below as <i>Pending</i>.${DEMO?'':' Or add them yourself in Supabase → Authentication → Users → Add user.'}</div>
   ${P.map(p=>`<div class="panel"><div class="row" style="justify-content:space-between"><div><b>${esc(p.full_name||p.email)}</b><div class="hint" style="margin:0">${esc(p.email)}</div></div>
     ${p.id===A.me.id?'<span class="pill g">You</span>':`<select class="inp" style="width:auto" onchange="setRole('${p.id}',this.value)">${['pending','viewer','editor','admin'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${{pending:'Pending (no access)',viewer:'Viewer',editor:'Editor',admin:'Admin'}[r]}</option>`).join('')}</select>`}</div>
     ${p.id!==A.me.id&&['viewer','editor'].includes(p.role)?`<label><input type="checkbox" ${p.all_locations?'checked':''} onchange="setAll('${p.id}',this.checked)"> All branches & brands</label>
      ${p.all_locations?'':[['branch','Branches'],['brand','Brands']].map(([k,t])=>`<div class="hint" style="margin-top:10px;font-weight:700">${t}</div><div class="chk">${L.filter(l=>kindOf(l)===k).map(l=>`<label><input type="checkbox" ${p.location_ids.includes(l.id)?'checked':''} onchange="setLoc('${p.id}','${l.id}',this.checked)">${esc(l.name)}</label>`).join('')}</div>`).join('')}${tabsHtml(p)}`:''}</div>`).join('')}`}
const EXTRA=()=>MODULES.filter(m=>!m.live&&!m.adminOnly).map(m=>[m.k,m.short]);
function tabsHtml(p){const t=p.tabs,on=k=>SECTIONS.some(s=>s[0]===k)?(!t||t.includes(k)):!!(t&&t.includes(k));
  const box=(k,n)=>`<label><input type="checkbox" ${on(k)?'checked':''} onchange="setTab('${p.id}','${k}',this.checked)">${n}</label>`;
  return `<label style="margin-top:12px">Access</label><div class="hint" style="margin-top:0;font-weight:700">Sales</div><div class="chk">${SECTIONS.map(([k,n])=>box(k,n)).join('')}</div>
   <div class="hint" style="margin-top:10px;font-weight:700">Other modules</div><div class="chk">${EXTRA().map(([k,n])=>box(k,n)).join('')}</div>`}
function setTab(id,k,on){const p=A._prof.find(x=>x.id===id);const s=new Set(p.tabs||SECTIONS.map(x=>x[0]));on?s.add(k):s.delete(k);
  const all=SECTIONS.map(x=>x[0]).concat(EXTRA().map(x=>x[0])),arr=all.filter(x=>s.has(x));
  const salesAllOnly=SECTIONS.every(x=>s.has(x[0]))&&arr.length===SECTIONS.length;upd(id,{tabs:salesAllOnly?null:arr})}
async function upd(id,patch){try{await DB.updateProfile(id,patch);toast('Saved');view()}catch(e){toast(e.message);view()}}
function setRole(id,r){upd(id,{role:r})}
function setAll(id,v){upd(id,{all_locations:v})}
function setLoc(id,loc,on){const p=A._prof.find(x=>x.id===id);const s=new Set(p.location_ids);on?s.add(loc):s.delete(loc);upd(id,{location_ids:[...s]})}

/* =================== admin: locations =================== */
async function vLocs(){const L=kindLocs();
  return `<h1>Locations & brands</h1><p class="sub">Columns of the daily sheet, in this order. Hidden ones keep their history.</p>
   <div class="panel">${segHtml()}<div style="height:10px"></div><div class="tscroll"><table class="t"><tr><th>#</th><th>Name</th><th>Order</th><th>Shown</th></tr>
    ${L.map((l,i)=>`<tr><td>${i+1}</td><td><input class="inp" style="padding:7px 9px" value="${esc(l.name)}" onchange="locUpd('${l.id}',{name:this.value.trim()})"></td>
     <td><button class="btn ghost sm" ${i?'':'disabled'} onclick="moveLoc(${i},-1)">↑</button> <button class="btn ghost sm" ${i<L.length-1?'':'disabled'} onclick="moveLoc(${i},1)">↓</button></td>
     <td><input type="checkbox" ${l.active?'checked':''} onchange="locUpd('${l.id}',{active:this.checked})"></td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:12px"><input class="inp" id="nl" placeholder="New ${KW().low}, e.g. ${A.kind==='brand'?'Coco':'Float Pearl'}" style="flex:1;min-width:200px"><button class="btn" onclick="addLoc()">Add ${KW().low}</button></div></div>
   <div class="panel"><h3>Backup</h3><p class="hint" style="margin-top:0">Download every figure ever entered, for safekeeping.</p><button class="btn green" onclick="backup()">⬇ Download full backup (Excel)</button></div>`}
async function locUpd(id,p){if(p.name==='')return toast('Name cannot be empty');try{await DB.updateLocation(id,p);await refresh()}catch(e){toast(e.message)}}
async function moveLoc(i,d){const L=kindLocs().slice(),j=i+d;[L[i],L[j]]=[L[j],L[i]];try{for(let k=0;k<L.length;k++)if(L[k].sort!==k+1)await DB.updateLocation(L[k].id,{sort:k+1});await refresh()}catch(e){toast(e.message)}}
async function addLoc(){const n=$('#nl').value.trim();if(!n)return;try{const KL=kindLocs();await DB.addLocation(n,(KL.length?Math.max(...KL.map(l=>l.sort)):0)+1,A.kind);toast(n+' added');await refresh()}catch(e){toast(e.message)}}
async function backup(){const all=await DB.sales('2000-01-01','2100-12-31'),ln={};A.locs.forEach(l=>ln[l.id]=l.name+(kindOf(l)==='brand'?' (brand)':''));
  xlsxOut('Crave_Finance_Backup_'+iso(new Date()),[['All sales',[['Date','Location','Amount (QAR)'],...all.map(r=>[r.sale_date,ln[r.location_id]||r.location_id,Number(r.amount)])]],['Locations',[['Name','Order','Shown'],...A.locs.map(l=>[l.name,l.sort,l.active?'Yes':'No'])]]])}

/* =================== admin: activity =================== */
async function vLog(){const R=await DB.audit();
  return `<h1>Activity</h1><p class="sub">Every added, changed or deleted figure and every access change (latest 300).</p>
   <div class="panel"><div class="tscroll"><table class="t"><tr><th>When</th><th>Who</th><th>What</th><th>Date</th><th>Location</th><th class="n">Old</th><th class="n">New</th></tr>
    ${R.map(a=>`<tr><td>${new Date(a.at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(a.email||'')}</td><td>${esc(a.action)}${a.detail?'<div class="hint" style="margin:0">'+esc(a.detail)+'</div>':''}</td><td>${a.sale_date?fdate(a.sale_date):''}</td><td>${esc(a.location||'')}</td><td class="n">${a.old_amount!=null?n2(a.old_amount):''}</td><td class="n">${a.new_amount!=null?n2(a.new_amount):''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No activity yet</td></tr>'}</table></div></div>`}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A.me&&A.me.role!=='pending'){A.cache={};if(['sheet','day','month','pay'].includes(A.tab))view()}});
boot();
</script>
